<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
body{width:1600px;height:640px;background:linear-gradient(135deg,#0f172a 0%,#1e293b 55%,#3b2a6b 100%);color:#fff;padding:72px 96px;position:relative;overflow:hidden}
.glow{position:absolute;right:-140px;top:-160px;width:640px;height:640px;border-radius:50%;background:radial-gradient(#7c5cff55,transparent 70%)}
.name{font-size:200px;font-weight:900;font-style:italic;line-height:1;letter-spacing:-4px}
.name span{background:linear-gradient(90deg,#a5b4fc,#f0abfc);-webkit-background-clip:text;color:transparent}
.tag{font-size:50px;font-weight:700;font-style:italic;margin-top:28px}
.sub{font-size:28px;font-weight:400;margin-top:22px;color:#cbd5e1}
.row{position:absolute;left:96px;right:96px;bottom:56px;display:flex;gap:40px;font-size:40px;color:#e2e8f0;white-space:nowrap}
.row div:nth-child(1){font-weight:300;font-style:italic}.row div:nth-child(2){font-weight:400;font-style:italic}.row div:nth-child(3){font-weight:700;font-style:italic}.row div:nth-child(4){font-weight:900;font-style:italic}
</style>
<div class="glow"></div>
<div class="name"><span>Ninter</span></div>
<div class="tag">日本語にも、きれいな斜体を。</div>
