<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
body{width:1600px;background:#f8fafc;padding:56px 72px}
h1{font-size:34px;font-weight:700;margin-bottom:32px}
.cols{display:flex;gap:32px}
.card{flex:1;background:#fff;border-radius:20px;padding:36px 40px;border:2px solid #e2e8f0}
.card.good{border-color:#7c5cff;box-shadow:0 8px 30px #7c5cff22}
.label{font-size:22px;font-weight:700;margin-bottom:22px;display:inline-block;padding:6px 16px;border-radius:99px;background:#e2e8f0;color:#475569}
.good .label{background:#7c5cff;color:#fff}
.t1{font-size:64px;line-height:1.35;font-weight:700}
.t2{font-size:40px;line-height:1.6;margin-top:14px}
.plain{font-family:"Plain","Noto Sans JP",sans-serif;font-style:italic}
.nin{font-family:"N";font-style:italic}
.note{font-size:20px;color:#64748b;margin-top:18px}
</style>
<h1>日本語の斜体を比べてみると</h1>
<div class="cols">
<div class="card"><div class="label">ふつうの斜体（擬似）</div>
<div class="t1 plain">日本語の斜体<br>Italic 2026</div>
<div class="t2 plain">ひらがなも漢字も、大きく傾いてしまいます。12:34 に会議。</div>
<div class="note">フォントに斜体がないとき、ソフトが文字を約20度ななめにします。</div></div>
<div class="card good"><div class="label">Ninter の斜体</div>
<div class="t1 nin">日本語の斜体<br>Italic 2026</div>
<div class="t2 nin" style="font-weight:400">ひらがなも漢字も、控えめな傾きでなじみます。12:34 に会議。</div>
<div class="note">日本語は約5.5度、欧文は Inter 本来の斜体。</div></div>
</div>
